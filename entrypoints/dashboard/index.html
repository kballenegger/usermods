<!doctype html>
<!--
  No data-theme here: see the note in sidepanel/index.html. The attribute is left off so the first
  paint is whatever the OS asks for, and main.tsx writes one only for an explicit choice.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>usermods — dashboard</title>
    <!-- The packaged pixel icon, so the tab/favicon carries the mark too. 32 and 128 are
         both whole multiples of the 16-unit grid, so neither is resampled into mush. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon/128.png" />
    <!-- Ahead of the stylesheets, and a classic script so it is not deferred past the first paint.
         This page is a full tab, so a flash of the wrong palette is a whole screen of it.
         See public/theme-boot.js. -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="../sidepanel/styles.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
