<!--
  Concept F — "window + brace" (the synthesis that became assets/icon.svg).
  Takes E's chromatic amber tile, which is what survives on a dark toolbar, and gives it D's
  meaning: the tile is a browser window (title bar with two dots), and the content area holds a
  dark code brace. A site, with a script inside it.
-->
