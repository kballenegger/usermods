<!--
  Concept D — "amber window, rewritten row".
  Inverts C: the browser window itself is amber, so the silhouette is chromatic and survives on
  both light and dark toolbars. Page rows are punched out in dark ink; the middle row is longer
  and overhangs the window edge — the mod rewriting the page, breaking out of the frame.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect x="14" y="18" width="100" height="92" rx="20" fill="#f59e0b"/>
  <rect x="14" y="18" width="100" height="22" rx="11" fill="#d97706"/>
  <rect x="34" y="56" width="42" height="10" rx="5" fill="#1c1917"/>
  <rect x="6" y="76" width="96" height="14" rx="7" fill="#1c1917"/>
  <rect x="34" y="100" width="30" height="10" rx="5" fill="#1c1917"/>
</svg>
